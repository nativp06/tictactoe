<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Budget</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --primary:#1565C0;--primary-light:#E3F2FD;--primary-dark:#0D47A1;
  --success:#2E7D32;--success-light:#E8F5E9;
  --danger:#C62828;--danger-light:#FFEBEE;
  --bg:#F0F4F8;--card:#fff;--text:#1A237E;--text-sec:#546E7A;
  --border:#CFD8DC;--group-bg:#E8EAF6;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;font-size:14px;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1565C0,#283593);padding:20px;}
.login-card{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo .logo-icon{font-size:3rem;}
.login-logo h1{font-size:1.6rem;font-weight:900;color:var(--primary);margin-top:6px;}
.login-logo p{color:var(--text-sec);font-size:.9rem;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-weight:700;margin-bottom:5px;color:var(--text);font-size:.85rem;}
.form-group input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:.95rem;color:var(--text);transition:border-color .2s;direction:rtl;font-family:inherit;}
.form-group input:focus{outline:none;border-color:var(--primary);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:10px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;border:none;transition:all .2s;}
.btn-primary{background:var(--primary);color:#fff;width:100%;padding:12px;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary);}
.btn-outline:hover{background:var(--primary-light);}
.btn-sm{padding:6px 14px;font-size:.82rem;border-radius:8px;width:auto;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-success-sm{background:var(--success);color:#fff;padding:6px 12px;font-size:.82rem;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-weight:700;}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:.88rem;font-weight:600;}
.alert-error{background:var(--danger-light);color:var(--danger);}
.link-btn{background:none;border:none;color:var(--primary);cursor:pointer;font-size:.88rem;text-decoration:underline;padding:0;font-family:inherit;}

/* APP */
.app{display:none;flex-direction:column;min-height:100vh;}
.app.active{display:flex;}

/* HEADER */
.app-header{background:var(--primary);color:#fff;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.header-logo{font-size:1.15rem;font-weight:900;display:flex;align-items:center;gap:8px;}
.header-actions{display:flex;align-items:center;gap:8px;}
.year-sel{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:5px 10px;font-family:inherit;font-size:.9rem;cursor:pointer;}
.year-sel option{color:var(--text);background:#fff;}
.user-chip{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:.85rem;font-weight:600;}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:6px 12px;font-size:.82rem;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;}
.btn-ghost:hover{background:rgba(255,255,255,.3);}

/* MONTH TABS */
.month-tabs-wrap{background:#fff;border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.month-tabs-wrap::-webkit-scrollbar{display:none;}
.month-tabs{display:flex;min-width:max-content;}
.month-tab{padding:10px 15px;cursor:pointer;font-family:inherit;font-size:.83rem;font-weight:600;color:var(--text-sec);border:none;background:none;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;}
.month-tab:hover{color:var(--primary);background:var(--primary-light);}
.month-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.month-tab.avg-tab{border-right:1px solid var(--border);color:#E65100;}
.month-tab.avg-tab.active{border-bottom-color:#E65100;color:#E65100;}

/* CONTENT */
.app-content{flex:1;padding:20px;max-width:900px;margin:0 auto;width:100%;}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.toolbar-title{font-size:1.15rem;font-weight:900;color:var(--text);}
.toolbar-actions{display:flex;gap:8px;}

/* SECTION HEADERS */
.sec-hdr{display:flex;align-items:center;padding:12px 16px;border-radius:10px 10px 0 0;}
.sec-hdr.income{background:var(--success);color:#fff;}
.sec-hdr.expense{background:var(--primary);color:#fff;margin-top:16px;}
.sec-hdr.summary{background:#37474F;color:#fff;margin-top:16px;border-radius:10px 10px 0 0;}
.sec-title{font-size:1rem;font-weight:800;}

/* TABLE */
.tbl-wrap{overflow-x:auto;margin-bottom:2px;border-radius:0 0 10px 10px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.tbl-wrap.last{margin-bottom:20px;}
.budget-tbl{width:100%;border-collapse:collapse;background:#fff;}
.budget-tbl th{padding:9px 14px;text-align:right;background:#ECEFF1;color:var(--text-sec);font-size:.76rem;font-weight:800;text-transform:uppercase;border-bottom:2px solid var(--border);}
.budget-tbl th:first-child{min-width:170px;}
.budget-tbl th:not(:first-child){text-align:center;width:115px;}
.budget-tbl td{padding:7px 14px;border-bottom:1px solid #ECEFF1;vertical-align:middle;}
.budget-tbl td:not(:first-child){text-align:center;}
.group-row td{background:var(--group-bg);font-weight:800;cursor:pointer;user-select:none;padding:10px 14px;}
.group-row:hover td{background:#C5CAE9;}
.group-row td:first-child{display:flex;align-items:center;gap:8px;}
.arrow{margin-right:auto;font-size:.7rem;color:var(--text-sec);transition:transform .2s;display:inline-block;}
.collapsed .arrow{transform:rotate(180deg);}
.item-row td:first-child{padding-right:30px;color:var(--text-sec);font-size:.92rem;}
.item-row:hover td{background:#FAFAFA;}
.total-row td{background:#ECEFF1;font-weight:800;padding:10px 14px;border-top:2px solid var(--border);}
.grand-row td{background:#CFD8DC;font-weight:900;font-size:.97rem;padding:10px 14px;border-top:2px solid var(--border);}
.income-row td{background:#F1F8F1;}
.income-row:hover td{background:#E8F5E9;}
.income-total-row td{background:#C8E6C9;font-weight:800;padding:10px 14px;border-top:2px solid #A5D6A7;}
.summary-row td{background:#fff;padding:10px 14px;border-bottom:1px solid #ECEFF1;}
.summary-hi td{background:#E8F5E9;font-weight:900;font-size:.97rem;padding:10px 14px;}

/* INPUTS */
.num-inp{width:100%;max-width:105px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;text-align:center;font-family:inherit;font-size:.88rem;transition:border-color .15s;direction:ltr;}
.num-inp:focus{outline:none;border-color:var(--primary);}

/* DIFF */
.d-pos{color:var(--success);font-weight:700;}
.d-neg{color:var(--danger);font-weight:700;}
.d-zero{color:var(--text-sec);}

/* MODAL */
.modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center;padding:16px;}
.modal-wrap.open{display:flex;}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:1.05rem;font-weight:800;color:var(--text);}

/* CATEGORY EDITOR */
.cat-group-ed{margin-bottom:14px;border:2px solid var(--border);border-radius:10px;overflow:hidden;}
.cat-group-hdr{padding:10px 14px;background:var(--group-bg);font-weight:700;font-size:.9rem;}
.cat-items-ed{padding:8px 14px;}
.cat-item-ed{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #ECEFF1;}
.cat-item-ed:last-child{border-bottom:none;}
.cat-item-ed input{flex:1;padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:.88rem;direction:rtl;}
.add-item-row{display:flex;gap:8px;margin-top:8px;}
.add-item-row input{flex:1;padding:7px 10px;border:2px solid var(--primary);border-radius:8px;font-family:inherit;font-size:.88rem;direction:rtl;}

/* NO DATA */
.no-data{text-align:center;padding:60px 20px;color:var(--text-sec);}
.no-data .nd-icon{font-size:3rem;margin-bottom:12px;}
.no-data p{font-size:1rem;font-weight:700;}

/* FAB */
.fab{position:fixed;bottom:24px;left:24px;width:58px;height:58px;border-radius:50%;background:var(--success);color:#fff;border:none;font-size:1.5rem;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.3);z-index:200;transition:transform .15s;}
.fab:hover{transform:scale(1.1);}
.app.active .fab{display:flex;}

/* MODAL SELECT */
.modal-sel{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:.95rem;direction:rtl;color:var(--text);}
.modal-sel:focus{outline:none;border-color:var(--primary);}

/* TX LOG */
.tx-log-hdr{background:#546E7A;color:#fff;margin-top:16px;}
.tx-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #ECEFF1;background:#fff;}
.tx-item:last-child{border-bottom:none;}
.tx-item:hover{background:#FAFAFA;}
.tx-cat{font-size:.9rem;font-weight:600;color:var(--text);}
.tx-sub{font-size:.78rem;color:var(--text-sec);margin-top:2px;}
.tx-amt{font-weight:800;color:var(--danger);white-space:nowrap;font-size:.95rem;}
.tx-del{background:none;border:none;cursor:pointer;color:var(--text-sec);font-size:1rem;padding:4px 7px;border-radius:6px;line-height:1;}
.tx-del:hover{background:var(--danger-light);color:var(--danger);}
.fab-spacer{height:80px;}

@media(max-width:600px){
  .app-content{padding:12px;}
  .budget-tbl th:first-child{min-width:130px;}
  .budget-tbl th:not(:first-child){width:85px;}
  .num-inp{max-width:78px;font-size:.82rem;}
  .month-tab{padding:9px 11px;font-size:.79rem;}
  .toolbar{flex-wrap:wrap;gap:8px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">💰</div>
      <h1>Family Budget</h1>
      <p>ניהול תקציב משפחתי חכם</p>
    </div>
    <div id="login-alert"></div>
    <div id="login-form">
      <div class="form-group"><label>שם משתמש</label>
        <input type="text" id="l-user" placeholder="הכנס שם משתמש" autocomplete="username"/></div>
      <div class="form-group"><label>סיסמה</label>
        <input type="password" id="l-pass" placeholder="הכנס סיסמה" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="btn btn-primary" onclick="doLogin()">כניסה ➜</button>
      <div style="text-align:center;margin-top:14px;">
        <button class="link-btn" onclick="toggleReg()">משתמש חדש? הירשם כאן</button>
      </div>
    </div>
    <div id="reg-form" style="display:none">
      <div class="form-group"><label>שם משתמש</label>
        <input type="text" id="r-user" placeholder="בחר שם משתמש" autocomplete="username"/></div>
      <div class="form-group"><label>סיסמה</label>
        <input type="password" id="r-pass" placeholder="בחר סיסמה" autocomplete="new-password"/></div>
      <div class="form-group"><label>שם בן / בת הזוג הראשון</label>
        <input type="text" id="r-p1" placeholder="לדוגמה: ישראל"/></div>
      <div class="form-group"><label>שם בן / בת הזוג השני</label>
        <input type="text" id="r-p2" placeholder="לדוגמה: ישראלה"/></div>
      <button class="btn btn-primary" onclick="doRegister()">הרשמה ➜</button>
      <div style="text-align:center;margin-top:14px;">
        <button class="link-btn" onclick="toggleReg()">יש לך חשבון? כנס כאן</button>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app">
  <header class="app-header">
    <div class="header-logo"><span>💰</span> Family Budget</div>
    <div class="header-actions">
      <select class="year-sel" id="year-sel" onchange="onYearChange()"></select>
      <div class="user-chip" id="user-chip"></div>
      <button class="btn-ghost" onclick="doLogout()">יציאה</button>
    </div>
  </header>
  <div class="month-tabs-wrap"><div class="month-tabs" id="month-tabs"></div></div>
  <div class="app-content" id="app-content"></div>
  <button class="fab" onclick="openAddExpense()" title="הוסף הוצאה">➕</button>
</div>

<!-- ADD EXPENSE MODAL -->
<div class="modal-wrap" id="add-exp-modal">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title">➕ הוסף הוצאה</div>
      <button class="btn btn-sm btn-outline" onclick="closeModal('add-exp-modal')">סגור</button>
    </div>
    <div class="form-group">
      <label>קטגוריה ראשית</label>
      <select class="modal-sel" id="ae-group" onchange="populateSubCats()"></select>
    </div>
    <div class="form-group">
      <label>תת-קטגוריה</label>
      <select class="modal-sel" id="ae-item"></select>
    </div>
    <div class="form-group">
      <label>סכום (₪)</label>
      <input type="number" id="ae-amount" min="0" placeholder="0"
        style="direction:ltr;text-align:right;"
        onkeydown="if(event.key==='Enter')submitAddExpense()"/>
    </div>
    <div class="form-group">
      <label>תאריך</label>
      <input type="date" id="ae-date" style="direction:ltr;"/>
    </div>
    <div class="form-group">
      <label>הערה (אופציונלי)</label>
      <input type="text" id="ae-note" placeholder="לדוגמה: קניות בסופר"/>
    </div>
    <div id="ae-alert"></div>
    <button class="btn btn-primary" onclick="submitAddExpense()">הוסף הוצאה ✓</button>
  </div>
</div>

<!-- EDIT CATEGORIES MODAL -->
<div class="modal-wrap" id="edit-modal">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title">✏️ עריכת קטגוריות הוצאות</div>
      <button class="btn btn-sm btn-outline" onclick="closeModal('edit-modal')">סגור</button>
    </div>
    <div id="edit-body"></div>
    <div style="margin-top:16px;">
      <button class="btn btn-primary" onclick="saveCategories()">שמור שינויים ✓</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-wrap" id="settings-modal">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title">⚙️ הגדרות</div>
      <button class="btn btn-sm btn-outline" onclick="closeModal('settings-modal')">סגור</button>
    </div>
    <div class="form-group"><label>שם בן / בת הזוג הראשון</label>
      <input type="text" id="s-p1"/></div>
    <div class="form-group"><label>שם בן / בת הזוג השני</label>
      <input type="text" id="s-p2"/></div>
    <button class="btn btn-primary" onclick="saveSettings()">שמור</button>
  </div>
</div>

<script>
// ===================== CONSTANTS =====================
const STORAGE_KEY = 'familyBudget_v1';
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

const DEFAULT_CATS = [
  {id:'housing',name:'דיור',icon:'🏠',items:[
    {id:'rent',name:'שכר דירה / משכנתא'},
    {id:'electric',name:'חשמל'},{id:'water',name:'מים'},{id:'gas',name:'גז'},
    {id:'internet',name:'אחר (אינטרנט+כבלים)'},{id:'phone_bill',name:'טלפון'},{id:'hoa',name:'ועד בית'},
    {id:'maint',name:'תחזוקה ותיקונים'},{id:'equipment',name:'ציוד'}
  ]},
  {id:'transport',name:'תחבורה',icon:'🚗',items:[
    {id:'fuel',name:'דלק'},{id:'car_maint',name:'תחזוקת רכב'},{id:'car_test',name:'טסט'},
    {id:'parking',name:'חניה'},{id:'pub_trans',name:'תחבורה ציבורית'},{id:'taxi',name:'מונית / אובר'}
  ]},
  {id:'insurance',name:'ביטוח',icon:'🛡️',items:[
    {id:'life_ins',name:'ביטוח חיים'},{id:'health_ins',name:'ביטוח בריאות'},
    {id:'car_ins',name:'ביטוח רכב'},{id:'home_ins',name:'ביטוח דירה'}
  ]},
  {id:'food',name:'מזון',icon:'🛒',items:[
    {id:'supermarket',name:'סופרמרקט'},{id:'veggies',name:'ירקות ופירות'},
    {id:'restaurants',name:'מסעדות'},{id:'coffee',name:'קפה'},{id:'delivery',name:'משלוחים'}
  ]},
  {id:'children',name:'ילדים',icon:'👶',items:[
    {id:'school',name:'גן / בית ספר'},{id:'activities',name:'חוגים'},
    {id:'school_sup',name:'ציוד לימודי'},{id:'kids_clothes',name:'בגדים'},
    {id:'babysitter',name:'בייביסיטר'},{id:'allowance',name:'כיס'}
  ]},
  {id:'legal',name:'משפטי',icon:'⚖️',items:[
    {id:'lawyer',name:'עורך דין'},{id:'notary',name:'נוטריון'},{id:'accountant',name:'רואה חשבון'}
  ]},
  {id:'savings',name:'חסכונות / השקעות',icon:'💰',items:[
    {id:'emergency',name:'קרן חירום'},{id:'pension',name:'פנסיה'},
    {id:'invest',name:'השקעות'},{id:'edu_fund',name:'קרן השתלמות'}
  ]},
  {id:'entertainment',name:'בידור',icon:'🎬',items:[
    {id:'movies',name:'סרטים / תיאטרון'},{id:'sport',name:'ספורט'},
    {id:'vacation',name:'חופשות'},{id:'subs',name:'מנויים'},{id:'books',name:'ספרים'}
  ]},
  {id:'gifts',name:'מתנות ותרומות',icon:'🎁',items:[
    {id:'gifts_i',name:'מתנות'},{id:'donations',name:'תרומות'},{id:'events',name:'אירועים'}
  ]},
  {id:'pets',name:'חיות מחמד',icon:'🐾',items:[
    {id:'pet_food',name:'מזון לחיות'},{id:'vet',name:'וטרינר'},{id:'pet_groom',name:'טיפוח'}
  ]},
  {id:'personal',name:'טיפוח אישי',icon:'💅',items:[
    {id:'haircut',name:'מספרה / קוסמטיקה'},{id:'clothes',name:'בגדים ונעליים'},
    {id:'fitness',name:'כושר'},{id:'pharmacy',name:'תרופות ובריאות'}
  ]},
  {id:'credit',name:'כרטיסי אשראי',icon:'💳',items:[
    {id:'card1',name:'כרטיס 1'},{id:'card2',name:'כרטיס 2'},{id:'card3',name:'כרטיס 3'}
  ]},
  {id:'taxes',name:'מיסים',icon:'🏛️',items:[
    {id:'income_tax',name:'מס הכנסה'},{id:'nat_ins',name:'ביטוח לאומי'},{id:'vat',name:'מע"מ'},
    {id:'arnona',name:'עירוני'}
  ]},
];

// ===================== STATE =====================
let DB = {};
let CU = null; // current user
let CY = new Date().getFullYear();
let CM = new Date().getMonth() + 1; // 1-12, 0=average
let collapsed = new Set();

// ===================== STORAGE =====================
function loadDB(){try{DB=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');}catch(e){DB={};}}
function saveDB(){localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));}

// ===================== AUTH =====================
function hash(p){let h=0;for(let i=0;i<p.length;i++)h=((h<<5)-h+p.charCodeAt(i))|0;return String(h);}

function toggleReg(){
  const lf=document.getElementById('login-form'),rf=document.getElementById('reg-form');
  const isL=lf.style.display!=='none';
  lf.style.display=isL?'none':'';rf.style.display=isL?'':'none';
  setAlert('login-alert','');
}

function setAlert(id,msg,type='error'){
  const el=document.getElementById(id);
  if(el)el.innerHTML=msg?`<div class="alert alert-${type}">${msg}</div>`:'';
}

function doLogin(){
  const u=document.getElementById('l-user').value.trim();
  const p=document.getElementById('l-pass').value;
  if(!u||!p){setAlert('login-alert','אנא מלא שם משתמש וסיסמה');return;}

// ===================== DATA HELPERS =====================
function ud(){return DB[CU];}
function cats(){return ud().categories;}

function getBM(y,m){
  const u=ud();
  if(!u.budget[y])u.budget[y]={};
  if(!u.budget[y][m])u.budget[y][m]={income:{},expenses:{},transactions:[]};
  if(!u.budget[y][m].transactions)u.budget[y][m].transactions=[];
  return u.budget[y][m];
}

function findItemName(itemId){
  for(const g of cats()){
    const it=g.items.find(i=>i.id===itemId);
    if(it)return{group:g.name,item:it.name,icon:g.icon};
  }
  return{group:'',item:itemId,icon:'📌'};
}

function getV(y,m,field,type){
  const bm=getBM(y,m);
  if(field==='p1'||field==='p2'||field==='extra')return(bm.income[field]&&bm.income[field][type])||0;
  return(bm.expenses[field]&&bm.expenses[field][type])||0;
}

function setV(y,m,field,type,val){
  const bm=getBM(y,m);
  const n=parseFloat(val)||0;
  if(field==='p1'||field==='p2'||field==='extra'){
    if(!bm.income[field])bm.income[field]={};
    bm.income[field][type]=n;
  }else{
    if(!bm.expenses[field])bm.expenses[field]={};
    bm.expenses[field][type]=n;
  }
  saveDB();refreshCalc(y,m);
}

// ===================== CALCULATIONS =====================
function incomeTotal(y,m,type){return['p1','p2','extra'].reduce((s,f)=>s+getV(y,m,f,type),0);}
function expenseTotal(y,m,type){return cats().reduce((s,g)=>s+g.items.reduce((ss,it)=>ss+getV(y,m,it.id,type),0),0);}
function groupTotal(y,m,g,type){return g.items.reduce((s,it)=>s+getV(y,m,it.id,type),0);}

function calcAvg(){
  const yd=ud().budget[CY]||{};
  const ms=Object.keys(yd).map(Number).filter(m=>{
    const bm=yd[m];
    return Object.values(bm.income||{}).some(v=>v.planned||v.actual)||
           Object.values(bm.expenses||{}).some(v=>v.planned||v.actual);
  });
  if(!ms.length)return null;
  const n=ms.length;
  const avg={income:{},expenses:{},n};
  ['p1','p2','extra'].forEach(f=>{
    avg.income[f]={
      planned:ms.reduce((s,m)=>s+getV(CY,m,f,'planned'),0)/12,
      actual:ms.reduce((s,m)=>s+getV(CY,m,f,'actual'),0)/12
    };
  });
  cats().forEach(g=>g.items.forEach(it=>{
    avg.expenses[it.id]={
      planned:ms.reduce((s,m)=>s+getV(CY,m,it.id,'planned'),0)/12,
      actual:ms.reduce((s,m)=>s+getV(CY,m,it.id,'actual'),0)/12
    };
  }));
  return avg;
}

// ===================== FORMATTING =====================
function fmt(n){
  if(n===undefined||n===null)return '—';
  return '₪'+Math.round(n).toLocaleString('en-US');
}

function dc(diff){
  if(!diff&&diff!==0)return '<span class="d-zero">—</span>';
  if(diff===0)return '<span class="d-zero">0</span>';
  const s=diff>0?'+':'';
  const c=diff>0?'d-pos':'d-neg';
  return `<span class="${c}">₪${s}${Math.round(diff).toLocaleString('en-US')}</span>`;
}

  for(let y=now-2;y<=now+2;y++){
    const o=document.createElement('option');
    o.value=y;o.textContent=y;if(y===CY)o.selected=true;
    sel.appendChild(o);

function buildMonthTabs(){

    `<button class="month-tab${i+1===CM?' active':''}" onclick="selMonth(${i+1})">${m}</button>`

// ===================== REFRESH CALC CELLS =====================
function refreshCalc(y,m){
  if(CM!==m||CY!==y)return;
  const set=(id,html)=>{const el=document.getElementById(id);if(el)el.innerHTML=html;};

  // Income diffs
  ['p1','p2','extra'].forEach(f=>{
    set(`di-${f}`,dc(getV(y,m,f,'actual')-getV(y,m,f,'planned')));
  });
  const tiPl=incomeTotal(y,m,'planned'),tiAc=incomeTotal(y,m,'actual');
  set('ti-pl',`<strong>${fmt(tiPl)}</strong>`);
  set('ti-ac',`<strong>${fmt(tiAc)}</strong>`);
  set('ti-dc',`<strong>${dc(tiAc-tiPl)}</strong>`);

  // Groups & items
  let tePl=0,teAc=0;
  cats().forEach(g=>{
    const gPl=groupTotal(y,m,g,'planned'),gAc=groupTotal(y,m,g,'actual');
    tePl+=gPl;teAc+=gAc;
    set(`gp-${g.id}`,fmt(gPl));set(`ga-${g.id}`,fmt(gAc));set(`gd-${g.id}`,dc(gPl-gAc));
    g.items.forEach(it=>{
      set(`id-${it.id}`,dc(getV(y,m,it.id,'planned')-getV(y,m,it.id,'actual')));
    });
  });

  set('te-pl',`<strong>${fmt(tePl)}</strong>`);
  set('te-ac',`<strong>${fmt(teAc)}</strong>`);
  set('te-dc',`<strong>${dc(tePl-teAc)}</strong>`);

  const plBal=tiPl-tePl,acBal=tiAc-teAc;
  set('s-ti-pl',fmt(tiPl));set('s-ti-ac',fmt(tiAc));set('s-ti-dc',dc(tiAc-tiPl));
  set('s-te-pl',fmt(tePl));set('s-te-ac',fmt(teAc));set('s-te-dc',dc(tePl-teAc));
  set('s-bal-pl',`<strong>${fmt(plBal)}</strong>`);
  set('s-bal-ac',`<strong>${fmt(acBal)}</strong>`);
  set('s-bal-dc',`<strong>${dc(acBal-plBal)}</strong>`);
}

// ===================== EDIT CATEGORIES =====================
function openEdit(){
  const body=document.getElementById('edit-body');
  body.innerHTML=cats().map((g,gi)=>`
    <div class="cat-group-ed" id="cg-${gi}">
      <div class="cat-group-hdr">${g.icon} ${g.name}</div>
      <div class="cat-items-ed">
        ${g.items.map((it,ii)=>`
          <div class="cat-item-ed" data-id="${it.id}" data-gi="${gi}" data-ii="${ii}">
            <input type="text" value="${esc(it.name)}" />
            <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">✕</button>
          </div>`).join('')}
        <div class="add-item-row">
          <input type="text" placeholder="+ הוסף תת-קטגוריה" id="new-${gi}" />
          <button class="btn-success-sm" onclick="addItem(${gi})">הוסף</button>
        </div>
      </div>
    </div>`).join('');
  openModal('edit-modal');
}

function addItem(gi){
  const inp=document.getElementById(`new-${gi}`);
  const name=inp.value.trim();if(!name)return;
  const catItems=document.querySelector(`#cg-${gi} .cat-items-ed`);
  const addRow=document.querySelector(`#cg-${gi} .add-item-row`);
  const div=document.createElement('div');
  div.className='cat-item-ed';
  div.dataset.id='c_'+Date.now();
  div.innerHTML=`<input type="text" value="${esc(name)}"/>
    <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">✕</button>`;
  catItems.insertBefore(div,addRow);
  inp.value='';
}

function saveCategories(){
  const c=cats();
  c.forEach((g,gi)=>{
    const itemEls=document.querySelectorAll(`#cg-${gi} .cat-item-ed`);
    g.items=Array.from(itemEls).map(el=>{
      const name=el.querySelector('input').value.trim();
      const id=el.dataset.id||'c_'+Date.now();
      return{id,name};
    }).filter(it=>it.name);
  });
  saveDB();closeModal('edit-modal');renderView();
}

  gSel.innerHTML=cats().map((g,i)=>`<option value="${i}">${g.icon} ${g.name}</option>`).join('');

  setTimeout(()=>document.getElementById('ae-amount').focus(),150);
}

function populateSubCats(preItemId){
  const gi=parseInt(document.getElementById('ae-group').value)||0;
  const g=cats()[gi];
  const iSel=document.getElementById('ae-item');
  iSel.innerHTML=g.items.map(it=>`<option value="${it.id}">${it.name}</option>`).join('');
  if(preItemId&&g.items.some(it=>it.id===preItemId))iSel.value=preItemId;
}

function submitAddExpense(){
  const itemId=document.getElementById('ae-item').value;
  const amount=parseFloat(document.getElementById('ae-amount').value)||0;
  const date=document.getElementById('ae-date').value;
  const note=document.getElementById('ae-note').value.trim();
  if(!amount||amount<=0){setAlert('ae-alert','אנא הכנס סכום חיובי','error');return;}
  if(!date){setAlert('ae-alert','אנא בחר תאריך','error');return;}
  const bm=getBM(CY,CM);
  if(!bm.expenses[itemId])bm.expenses[itemId]={planned:0,actual:0};
  bm.expenses[itemId].actual=(bm.expenses[itemId].actual||0)+amount;
  bm.transactions.push({id:'tx_'+Date.now(),itemId,amount,date,note});
  saveDB();
  closeModal('add-exp-modal');
  renderView();
}

function deleteTransaction(txId){
  if(!confirm('למחוק הוצאה זו?'))return;
  const bm=getBM(CY,CM);
  const tx=bm.transactions.find(t=>t.id===txId);
  if(!tx)return;
  if(bm.expenses[tx.itemId]){
    bm.expenses[tx.itemId].actual=Math.max(0,(bm.expenses[tx.itemId].actual||0)-tx.amount);
  }
  bm.transactions=bm.transactions.filter(t=>t.id!==txId);
  saveDB();renderView();
}

// ===================== SETTINGS =====================
function openSettings(){
  const p=ud().partners;
  document.getElementById('s-p1').value=p[0]||'';
  document.getElementById('s-p2').value=p[1]||'';
  openModal('settings-modal');
}

function saveSettings(){
  const p1=document.getElementById('s-p1').value.trim();
  const p2=document.getElementById('s-p2').value.trim();
  if(p1)ud().partners[0]=p1;if(p2)ud().partners[1]=p2;
  saveDB();closeModal('settings-modal');renderView();
}

// ===================== MODAL UTILS =====================
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

// ===================== UTILS =====================
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ===================== INIT =====================
function init(){
  loadDB();
  const saved=localStorage.getItem('fb_cu');
  if(saved&&DB[saved]){CU=saved;enterApp();}
}
window.addEventListener('load',init);
</script>
